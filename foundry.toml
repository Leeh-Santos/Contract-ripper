[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "targets"
# Read PoCs recursively from each target's test/ dir.
match_path = "targets/**/test/**/*.t.sol"
optimizer = true
optimizer_runs = 200
# Historical incidents span many Solidity versions; let forge auto-pick.
auto_detect_solc = true
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
# Export ETH_RPC_URL (archive node) before running fork tests. Add chains as needed.
mainnet = "${ETH_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
bsc = "${BSC_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 32
